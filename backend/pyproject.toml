[project]
name = "kabisado-backend"
version = "0.1.0"
description = "Kabisado (Reviewer Generator) backend: FastAPI API, Procrastinate worker, AI generation pipeline."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "instructor>=1.17.0",
    "jinja2>=3.1.6",
    "litellm>=1.106.6",
    "pgvector>=0.5.1",
    "pint>=0.26.2",
    "procrastinate>=3.10.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf>=2.0",
    "sentry-sdk>=2.73.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
    "supabase>=2.33.0",
    "svix>=2.9.1",
    "sympy>=1.14.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
    "wasmtime>=50.0.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "unit: pure functions, no I/O",
    "integration: needs Postgres (local Supabase) and/or real fastembed",
    "api: HTTP-level tests via httpx.AsyncClient",
    "security: auth, isolation and answer-leak checks",
    "perf: performance checks",
    "ai_eval: AI output quality evaluations (never real LLM calls in CI)",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "time-machine>=3.6.0",
]
